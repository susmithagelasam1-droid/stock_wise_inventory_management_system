<!doctype html><html><head><meta charset="utf-8"><title>StockWise Register</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="auth-body"><section class="auth-card"><h1>Create User Account</h1><p>All self-registered accounts have user/view-only access.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required minlength="3"></label><label>Password (minimum 8 characters)<input type="password" name="password" required minlength="8"></label><button>Register</button></form><p><a href="/login">Back to login</a></p></section></body></html>
